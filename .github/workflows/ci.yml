name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Substitute from + push build outputs to the ismailkattakath Cachix cache
      # (so CI and consumers don't rebuild). Token is a repo secret.
      - uses: cachix/cachix-action@v15
        with:
          name: ismailkattakath
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Formatting
        run: nix run nixpkgs#nixfmt-rfc-style -- --check $(find . -name '*.nix')
      - name: Flake outputs well-formed
        run: nix flake show
      - name: Module eval check
        run: nix build .#checks.x86_64-linux.module-evaluates -L
      - name: macOS plant app evaluates
        run: nix eval .#packages.aarch64-darwin.firmware-plant.drvPath
